name: SecurCrew LinkedIn Auto-Poster

on:
  schedule:
    # Hourly. Collect fills the queue; publish drains a few items per run.
    # Free-tier friendly (Make.com ~1,000 ops/mo) via PER_RUN_CAP + DAILY_CAP.
    - cron: '0 * * * *'
  workflow_dispatch: {}

# Allow the job to commit the updated state file back to the repo.
permissions:
  contents: write

# Avoid overlapping runs stepping on each other's state commit.
concurrency:
  group: securcrew-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect feeds into queue
        env:
          # Optional free AI summaries (Groq/GitHub Models/Gemini). Omit to use clipping.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python collect.py

      - name: Publish queued items
        env:
          # POST_BACKEND: "api" (default) or "webhook". Set a repo variable to switch.
          POST_BACKEND: ${{ vars.POST_BACKEND }}
          # Used when POST_BACKEND=api
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          # Used when POST_BACKEND=webhook (Zapier/Make/n8n catch hook URL)
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python publish.py

      - name: Commit updated state
        run: |
          git config user.name "securcrew-bot"
          git config user.email "securcrew-bot@users.noreply.github.com"
          git add state/state.json state/queue.json docs/data/items.json
          git commit -m "chore: update queue/dedup state + site data [skip ci]" || echo "no change"
          git push || echo "nothing to push"
