name: SecurCrew Collector (site + queue)

# Aggregates RSS feeds, deduplicates, summarizes, and writes the GitHub Pages
# data file (docs/data/items.json) plus the post queue. This drives the website
# and is INDEPENDENT of LinkedIn — it needs no LinkedIn credentials and runs
# even if posting is never configured.

on:
  schedule:
    # Twice daily (06:00 & 18:00 UTC). One aggregation fills the queue + site
    # data for the whole day; the Publisher paces posts from that saved store.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with the publisher so the two never commit state at the same time.
concurrency:
  group: securcrew-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect feeds -> queue + site data
        env:
          # AI is enabled when the AI_API_KEY secret is set (recommended: a free
          # Groq key). With only the key, the code defaults to Groq
          # (llama-3.1-8b-instant). AI_BASE_URL / AI_MODEL variables are optional
          # overrides for other providers. Set USE_AI_SUMMARY=0 to disable.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          USE_AI_SUMMARY: ${{ vars.USE_AI_SUMMARY }}
        run: python collect.py

      - name: Commit site data + queue
        run: |
          git config user.name "securcrew-bot"
          git config user.email "securcrew-bot@users.noreply.github.com"
          git add docs/data/items.json state/queue.json state/state.json
          git commit -m "chore: refresh site data + queue [skip ci]" || echo "no change"
          git push || echo "nothing to push"
