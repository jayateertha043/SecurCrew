<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurCrew — Security News Feed</title>
  <meta name="description" content="Curated infosec, cybersecurity, and bug-bounty news with AI summaries." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div>
          <h1>SecurCrew</h1>
          <p class="tagline">Infosec · Cybersecurity · Bug Bounty — curated &amp; AI-summarized</p>
        </div>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <section class="controls" aria-label="Filters">
        <input id="search" type="search" placeholder="Search stories…" autocomplete="off" />
        <select id="sourceFilter" aria-label="Filter by source">
          <option value="">All sources</option>
        </select>
      </section>
      <div class="meta-row">
        <span id="count" class="count"></span>
        <div id="activeFilters" class="active-filters"></div>
      </div>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div class="more-wrap">
      <button id="showMore" class="show-more" hidden></button>
    </div>

    <p id="empty" class="empty" hidden>No stories yet. The feed populates on the next scheduled run.</p>
  </main>

  <button id="toTop" class="to-top" hidden aria-label="Back to top" title="Back to top">↑</button>

  <footer class="site-footer">
    <div class="wrap">
      <span id="updated"></span>
      <span class="sep">·</span>
      <span>Built with GitHub Actions · Static &amp; free</span>
    </div>
  </footer>

  <script src="app.js?v=5" defer></script>
</body>
</html>
